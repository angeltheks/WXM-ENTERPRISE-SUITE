name: WXM NEXTGEN CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  hygiene-and-web:
    name: Hygiene, frontend and CMS checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify forbidden tracked files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)(build|\.gradle|\.idea|node_modules)(/|$)|(^|/)local\.properties$|\.apk$|\.aab$|(^|/)\.env$|(^|/)\.DS_Store$|^cms-remote-starter/data/|^cms-remote-starter/public/uploads/' || true)"
          if [ -n "$forbidden" ]; then
            echo "Forbidden tracked files detected:"
            echo "$forbidden"
            exit 1
          fi

      - name: Secret guard
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(WXM_CMS_ADMIN_PASSWORD=changeme|local-dev-secret|AIza[0-9A-Za-z_-]{20,}|sk-[0-9A-Za-z]{20,}|BEGIN (RSA|PRIVATE) KEY)' -- ':!v2/cms/assets/vendor/**' ':!v2/cms/cms/assets/vendor/**' ':!.github/workflows/ci.yml' ':!scripts/smoke-check.sh'; then
            echo "Potential secret or unsafe placeholder found."
            exit 1
          fi

      - name: Smoke checks
        shell: bash
        run: |
          set -euo pipefail
          scripts/smoke-check.sh

  android-debug-build:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: hygiene-and-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android-webview
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug
